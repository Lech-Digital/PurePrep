# Deploys PurePrep to lechdigital-prod on every push to main (work happens on branches; merging is the approval) and on
# "Run workflow": its tests (the CI workflow), then Lech-Digital/lechdigital-infra's deploy-app builds the image on GitHub, streams it to the
# server and waits for https://api.pureprep.lechdigital.nl/health. Its /health does not report the commit yet, so an HTTP 200 is enough.
name: Deploy (production)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    uses: Lech-Digital/lechdigital-infra/.github/workflows/deploy-app.yml@main
    with:
      app: pureprep
      image: pureprep-web
      health-url: https://api.pureprep.lechdigital.nl/health
      health-reports-commit: false
    secrets: inherit
